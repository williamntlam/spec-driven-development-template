version: "2.0.0"
last_updated: "2026-08-08"

rules:
  - id: "R001"
    name: "No undocumented secrets"
    severity: "critical"
    description: >
      Environment variables that contain secrets must be declared in
      .context/domain/fields.yaml with secret: true before use in code.
    enforcement: "required"

  - id: "R002"
    name: "No PII in logs"
    severity: "critical"
    description: >
      Never log emails, passwords, tokens, or Authorization headers.
      Use opaque user_id / bookmark_id only.
    enforcement: "required"
    related_docs:
      - ".context/engineering/sentry.md"

  - id: "R003"
    name: "Auth required for mutating bookmark APIs"
    severity: "high"
    description: >
      POST/PATCH/DELETE on /api/v1/bookmarks* require a valid session.
      Public share-read endpoints are allowed only when a spec marks them public.
    enforcement: "required"

  - id: "R004"
    name: "Spec before durable schema change"
    severity: "high"
    description: >
      New bookmark/user columns or public API contract changes require a numbered
      spec under .context/specs/ and updates to fields.yaml / SCHEMA.md.
    enforcement: "required"

  - id: "R005"
    name: "Glossary-aligned naming"
    severity: "medium"
    description: >
      Use User and Bookmark (not Link, Customer, or Article) unless glossary updated.
    enforcement: "required"

  - id: "R006"
    name: "Bookmarks are private by default"
    severity: "high"
    description: >
      A Bookmark is readable/writable only by its owning User unless a ShareLink
      (or equivalent) spec explicitly introduces public read.
    enforcement: "required"
