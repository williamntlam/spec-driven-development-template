version: "2.0.0"
last_updated: "2026-08-08"

enums: {}

tables:
  users:
    description: "Authenticated principals"
    columns:
      id: { type: "uuid", required: true, unique: true }
      email: { type: "string", required: true, unique: true, pii: true, max_length: 320 }
      password_hash: { type: "string", required: true, secret: true }
      created_at: { type: "timestamp", required: true }

  bookmarks:
    description: "User-owned saved URLs"
    columns:
      id: { type: "uuid", required: true, unique: true }
      user_id: { type: "uuid", required: true, fk: "users.id" }
      url: { type: "string", required: true, max_length: 2048 }
      title: { type: "string", required: true, max_length: 200 }
      created_at: { type: "timestamp", required: true }
      updated_at: { type: "timestamp", required: true }

payloads:
  auth_login_payload:
    fields:
      email: { type: "string", required: true }
      password: { type: "string", required: true }
  bookmark_create_payload:
    fields:
      url: { type: "string", required: true }
      title: { type: "string", required: true }

env:
  APP_ENV:
    type: "string"
    required: true
    secret: false
    allowed_values: ["development", "staging", "production"]
  PORT:
    type: "string"
    required: false
    secret: false
    default: "3000"
  DATABASE_URL:
    type: "string"
    required: true
    secret: true
  LOG_LEVEL:
    type: "string"
    required: false
    secret: false
    default: "info"
    allowed_values: ["debug", "info", "warn", "error"]
  SESSION_SECRET:
    type: "string"
    required: true
    secret: true
    description: "Signing / session secret"
