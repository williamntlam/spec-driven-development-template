# ==============================================================================
# DOMAIN GLOSSARY
# ==============================================================================
# Universal terminology to eliminate naming ambiguity across code, specs, and UI.

version: "2.0.0"
last_updated: "2026-08-08"

terms:
  - term: "Spec"
    definition: >
      A numbered, dual-representation feature contract under .context/specs/
      consisting of a narrative spec.md and a declarative spec.yaml.
    aliases: ["specification", "RFC"]
    do_not_confuse_with: ["ticket", "PR description"]

  - term: "Context"
    definition: >
      The machine- and human-readable project truth stored under .context/,
      including schemas, rules, patterns, and active working state.
    aliases: [".context"]

  - term: "ExampleEntity"
    definition: >
      Placeholder domain entity used by the template. Replace with real domain
      terms before implementation work begins.
    aliases: []
    preferred_code_name: "ExampleEntity"
    preferred_table_name: "example_entities"

  # Example distinctions — customize for your domain:
  # - term: "User"
  #   definition: "Authenticated human principal with login credentials."
  #   do_not_confuse_with: ["Customer", "Account"]
  # - term: "Customer"
  #   definition: "Billing or commercial relationship entity; may map to one or more Users."
  # - term: "Account"
  #   definition: "Tenant or workspace boundary owning resources and memberships."
