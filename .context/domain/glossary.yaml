version: "2.0.0"
last_updated: "2026-08-08"

terms:
  - term: "Harbor"
    definition: "The product — a personal bookmarks API."
    aliases: ["app", "service"]

  - term: "User"
    definition: "Authenticated human principal with email + password credentials."
    preferred_code_name: "User"
    preferred_table_name: "users"
    do_not_confuse_with: ["Bookmark"]

  - term: "Bookmark"
    definition: "A saved URL owned by exactly one User, with a title."
    preferred_code_name: "Bookmark"
    preferred_table_name: "bookmarks"
    do_not_confuse_with: ["User", "ShareLink"]

  - term: "ShareLink"
    definition: >
      A future public token that can expose a single Bookmark read-only.
      Not implemented yet — may appear in eval tasks.
    preferred_code_name: "ShareLink"
    preferred_table_name: "share_links"

  - term: "Session"
    definition: "Bearer token mapping to a User id after login."
    aliases: ["auth token"]
